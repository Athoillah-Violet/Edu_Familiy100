<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - Edu Family 100</title>
</head>
<body>
  <h1>Dashboard Admin BK</h1>

  <!-- Info Admin & Logout -->
  <header id="admin-header" style="margin-bottom: 20px;">
    <span>Masuk sebagai: <strong id="admin-email">Memeriksa...</strong></span> |
    <button type="button" id="logout-btn">Keluar (Logout)</button>
  </header>

  <div id="notice-msg"></div>

  <hr>

  <!-- Form Buat Paket Baru -->
  <section id="create-section">
    <h2>Buat Paket Kategori Baru</h2>
    <form id="create-category-form">
      <div>
        <label for="create-title">Judul Paket (Maks. 100 karakter):</label><br>
        <input type="text" id="create-title" name="title" maxlength="100" required placeholder="Contoh: Komunikasi Asertif & Resolusi Konflik" style="width: 100%; max-width: 500px;">
      </div>
      <br>
      <div>
        <label for="create-desc">Deskripsi Singkat (Maks. 300 karakter):</label><br>
        <textarea id="create-desc" name="description" maxlength="300" rows="3" placeholder="Ringkasan materi atau tujuan bimbingan konseling..." style="width: 100%; max-width: 500px;"></textarea>
      </div>
      <br>
      <div>
        <label>
          <input type="checkbox" id="create-published" name="is_published">
          Publikasikan sekarang (dapat diakses oleh siswa)
        </label>
      </div>
      <br>
      <div>
        <button type="submit" id="create-submit-btn">Tambah Paket Baru</button>
      </div>
    </form>
  </section>

  <hr>

  <!-- Section Edit Paket (Tersembunyi jika sedang tidak mengedit) -->
  <section id="edit-section" style="display: none; background: #fdf6b2; border: 1px solid #e3a008; padding: 12px; margin-bottom: 20px;">
    <h2>Edit Paket Kategori</h2>
    <form id="edit-category-form">
      <input type="hidden" id="edit-id">
      <div>
        <label for="edit-title">Judul Paket:</label><br>
        <input type="text" id="edit-title" maxlength="100" required style="width: 100%; max-width: 500px;">
      </div>
      <br>
      <div>
        <label for="edit-desc">Deskripsi:</label><br>
        <textarea id="edit-desc" maxlength="300" rows="3" style="width: 100%; max-width: 500px;"></textarea>
      </div>
      <br>
      <div>
        <label>
          <input type="checkbox" id="edit-published">
          Publikasikan
        </label>
      </div>
      <br>
      <div>
        <button type="submit" id="edit-save-btn">Simpan Perubahan</button>
        <button type="button" id="edit-cancel-btn">Batal</button>
      </div>
    </form>
  </section>

  <!-- Daftar Paket -->
  <section id="list-section">
    <h2>Daftar Paket Pembelajaran BK</h2>
    
    <div id="loading-state">Memuat daftar paket kategori...</div>
    <div id="empty-state" style="display: none;"><em>Belum ada paket kategori. Silakan buat paket baru di atas.</em></div>
    <div id="categories-list"></div>
  </section>

  <hr>
  <nav>
    <a href="/index.html">&larr; Kembali ke Beranda</a>
  </nav>

  <script type="module" src="/src/admin/dashboard.js"></script>
</body>
</html>
