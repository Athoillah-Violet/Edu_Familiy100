<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin Guru BK - Family 100 BK</title>
  <meta name="description" content="Masuk panel admin guru bimbingan konseling untuk mengelola materi kuis.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="flex flex-col min-h-screen bg-[#080e1e] text-slate-100 justify-between">
  <!-- Minimal Top Header -->
  <header class="py-4 px-6 border-b border-[#1e2f5c] bg-[#0b1329]">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="/index.html" class="flex items-center space-x-2">
        <span class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-base shadow-glowBlue">
          F
        </span>
        <span class="font-bold text-white text-base">
          Family 100 <span class="text-blue-400">BK</span>
        </span>
      </a>
      <a href="/index.html" class="text-xs font-semibold text-slate-400 hover:text-white transition-colors">
        &larr; Beranda
      </a>
    </div>
  </header>

  <!-- Login Form Card -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="bg-[#0f1a36] rounded-xl border border-[#1e2f5c] shadow-2xl max-w-sm w-full p-6 sm:p-8">
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-blue-950/60 border border-blue-800/50 text-blue-400 mx-auto flex items-center justify-center font-bold text-xl mb-3">
          🔒
        </div>
        <h1 class="text-xl font-bold text-white">Login Admin Guru BK</h1>
        <p class="text-xs text-slate-400 mt-1">Masuk untuk mengelola paket soal dan materi refleksi.</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-300 mb-1">Alamat Email:</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@sekolah.sch.id" class="w-full px-3 py-2 text-sm text-white bg-[#132247] border border-[#1e2f5c] rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors placeholder:text-slate-500">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="password" class="block text-xs font-semibold text-slate-300">Kata Sandi:</label>
            <button type="button" id="toggle-password-btn" class="text-[11px] font-medium text-blue-400 hover:text-blue-300 focus:outline-none">Lihat</button>
          </div>
          <div class="relative">
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" class="w-full px-3 py-2 text-sm text-white bg-[#132247] border border-[#1e2f5c] rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors placeholder:text-slate-500">
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full inline-flex items-center justify-center font-semibold px-4 py-2.5 text-sm rounded-lg bg-blue-600 text-white hover:bg-blue-500 active:bg-blue-700 transition-all shadow-glowBlue focus:outline-none focus:ring-2 focus:ring-blue-500">
          Masuk ke Panel Admin
        </button>
      </form>

      <div id="status-message" class="mt-3 text-xs text-rose-400 font-medium text-center"></div>

      <div class="mt-6 pt-4 border-t border-[#1e2f5c] text-center">
        <a href="/index.html" class="text-xs text-slate-400 hover:text-white transition-colors">
          &larr; Kembali ke Beranda
        </a>
      </div>
    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="py-4 text-center text-xs text-slate-500 border-t border-[#1e2f5c] bg-[#0b1329]">
    Family 100 BK &bull; Panel Khusus Pembina &amp; Guru Bimbingan Konseling
  </footer>

  <script type="module" src="/src/admin/login.js"></script>
</body>
</html>
