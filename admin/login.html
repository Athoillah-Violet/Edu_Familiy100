<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Edu Family 100</title>
</head>
<body>
  <h1>Login Admin / Guru BK</h1>
  <p>Masukkan akun admin bimbingan konseling untuk mengelola paket soal.</p>

  <div id="notice-area"></div>

  <form id="login-form">
    <div>
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@sekolah.sch.id">
    </div>
    <br>
    <div>
      <label for="password">Password:</label><br>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="******">
    </div>
    <br>
    <div>
      <button type="submit" id="submit-btn">Masuk</button>
    </div>
  </form>

  <p id="status-message" style="margin-top: 16px; color: #b91c1c;"></p>

  <hr>
  <nav>
    <a href="/index.html">&larr; Kembali ke Beranda</a>
  </nav>

  <script type="module" src="/src/admin/login.js"></script>
</body>
</html>
